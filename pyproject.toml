[project]
name = "09orche"
version = "0.1.0"
description = "Expose OpenRouter models as sandboxed agent tools for Claude Code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "09kz" }]
keywords = ["mcp", "model-context-protocol", "openrouter", "claude-code", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    # Pinned deliberately: mcp>=2.0 negotiates protocol 2025-11-25, which
    # Claude Code does not yet speak, and pydantic-settings>=2.7 raises an
    # IncompleteFieldDefinitionWarning that FastMCP turns into a silent
    # startup crash (shows up only as CONNECTION_CLOSED in `claude mcp list`,
    # with no traceback on stderr). Do not bump either without confirming
    # Claude Code accepts the newer MCP protocol version first.
    "mcp==1.9.4",
    "pydantic-settings<2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
orche = "orche.server:main"

[project.urls]
Homepage = "https://github.com/09kz/09orche"
Issues = "https://github.com/09kz/09orche/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orche"]

[tool.hatch.build.targets.wheel.force-include]
"src/orche/models.toml" = "orche/models.toml"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
