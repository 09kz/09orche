# Conclave model catalogue.
#
# Each [models.<alias>] block becomes a tool named `ask_<alias>`.
# `id` must be a valid OpenRouter model id — verify at
# https://openrouter.ai/api/v1/models before adding one.
#
# `fallback` (optional) names another alias in this file to retry with if
# the primary model returns a 429 (rate limited) after exhausting retries.
# Useful for free-tier models, which share upstream capacity.
#
# Override this file by pointing CONCLAVE_MODELS_PATH at your own copy,
# or by placing a models.toml in your current working directory.

[models.ox_alpha]
id = "stealth/ox-alpha"
description = """
Ox Alpha — OpenRouter's flagship stealth model. 1M context, multimodal \
(text/image/video), strong reasoning. Good default for hard problems.
"""
fallback = "nemotron_lightning"

[models.nemotron_ultra]
id = "nvidia/nemotron-3-ultra-550b-a55b:free"
description = """
NVIDIA Nemotron 3 Ultra 550B — the largest model in this set, 1M context, \
deep reasoning. Use for analysis that needs real depth.
"""
fallback = "nemotron_lightning"

[models.nemotron_lightning]
id = "nvidia/nemotron-3.5-lightning:free"
description = """
NVIDIA Nemotron 3.5 Lightning — 1M context, tuned for speed. Good for bulk \
or simple tasks, and as a fallback for other models.
"""

[models.glm]
id = "z-ai/glm-5.2:free"
description = "Z.ai GLM 5.2 — 256k context. Strong general-purpose and coding model."
fallback = "north_code"

[models.north_code]
id = "cohere/north-mini-code:free"
description = "Cohere North Mini Code — 256k context, specialized for code."

[models.laguna]
id = "poolside/laguna-s-2.1:free"
description = "Poolside Laguna S 2.1 — 262k context, built for software engineering tasks."
fallback = "north_code"

[models.dots_note]
id = "dots-studio/dots-3-note-preview:free"
description = """
Dots3 Note Preview — 512k context, text and image. Good for working through \
long documents.
"""
